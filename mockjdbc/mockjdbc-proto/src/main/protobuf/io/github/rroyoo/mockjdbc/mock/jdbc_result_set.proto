syntax = "proto3";

package io.github.rroyoo.mockjdbc.mock;

import "io/github/rroyoo/mockjdbc/mock/jdbc_types.proto";

option java_package = "io.github.rroyoo.mockjdbc.mock";
option java_multiple_files = true;
option optimize_for = SPEED;

/**
 * Column definition from ResultSetMetaData
 */
message ColumnMetadata {
  // Absent text fields represent null JDBC metadata; present empty strings remain empty.
  optional string name = 1;
  optional string label = 2;
  int32 sql_type = 3;
  optional string type_name = 4;
  // Absent values preserve compatibility with older events and use JDBC metadata defaults.
  optional int32 precision = 5;
  optional int32 scale = 6;
  optional int32 nullable = 7;
  optional string table_name = 8;
  optional string schema_name = 9;
  optional string catalog_name = 10;
  optional bool auto_increment = 11;
}

/**
 * Data Row
 */
message Row {
  repeated JdbcValue values = 1;
}

/**
 * The internal structure of the ResultSet
 */
message SerializedResultSet {
  repeated ColumnMetadata metadata = 1;
  repeated Row rows = 2;
}