name: CI Build and Test

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Verify Docker availability (Testcontainers)
        run: docker version

      - name: Build and test mockjdbc reactor
        working-directory: mockjdbc
        run: mvn -B -ntp clean install

      - name: Test standalone sample app
        working-directory: mockjdbc-spring-users
        run: mvn -B -ntp verify

      - name: Analyze with CodeQL
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@v4

      - name: Publish test and coverage summary
        if: always()
        run: python3 .github/scripts/summarize-test-results.py
