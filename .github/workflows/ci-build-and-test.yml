name: CI Build and Test

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker availability (Testcontainers)
        run: docker version

      - name: Build and test mockjdbc reactor
        working-directory: mockjdbc
        run: mvn -B -ntp verify

      - name: Test standalone sample app
        working-directory: mockjdbc-spring-users
        run: mvn -B -ntp test
