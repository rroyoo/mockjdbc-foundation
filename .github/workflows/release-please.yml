name: Release Please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Verify release token is configured
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Configure the repository Actions secret RELEASE_PLEASE_TOKEN before enabling release automation."
            exit 1
          fi

      - name: Create or update release pull request
        uses: googleapis/release-please-action@v4
        with:
          # A repository-scoped PAT lets the release PR and tag trigger CI and publishing.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
