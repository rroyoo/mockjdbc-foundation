services:

  # ─── Kafka (KRaft, no Zookeeper) ─────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.9.6
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"   # internal inter-service communication
      - "9094:9094"   # host access
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ─── Downloads the WireMock gRPC extension ───────────────────────────────────
  wiremock-grpc-extension:
    image: curlimages/curl:8.20.0
    user: "0:0"
    command:
      - -fsSL
      - -o
      - /extensions/wiremock-grpc-extension-standalone-0.11.0.jar
      - https://repo1.maven.org/maven2/org/wiremock/wiremock-grpc-extension-standalone/0.11.0/wiremock-grpc-extension-standalone-0.11.0.jar
    volumes:
      - wiremock_extensions:/extensions

  # ─── Copies the Kafka→WireMock bridge JAR into the extensions volume ──────────
  # Prerequisite: cd mockjdbc && mvn -pl mockjdbc-wiremock -am package -DskipTests
  wiremock-kafka-bridge-extension:
    image: mirror.gcr.io/library/debian:12.13-slim
    pull_policy: if_not_present
    command:
      - /bin/sh
      - -ec
      - cp /bridge/mockjdbc-wiremock-1.0.0-SNAPSHOT.jar /extensions/
    volumes:
      - ../mockjdbc/mockjdbc-wiremock/target:/bridge:ro
      - wiremock_extensions:/extensions

  # ─── Compiles the .proto to a binary descriptor for WireMock gRPC ────────────
  wiremock-grpc-descriptors:
    image: mirror.gcr.io/library/debian:12.13-slim
    pull_policy: if_not_present
    command:
      - /bin/sh
      - -ec
      - |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends protobuf-compiler libprotobuf-dev ca-certificates
        protoc \
          -I=/proto \
          -I=/usr/include \
          --include_imports \
          --descriptor_set_out=/grpc/mockjdbc-services.dsc \
          /proto/io/github/rroyoo/mockjdbc/mock/mocked_query_service.proto
    volumes:
      - ../mockjdbc/mockjdbc-proto/src/main/protobuf:/proto:ro
      - wiremock_grpc_descriptors:/grpc

  # ─── WireMock gRPC ───────────────────────────────────────────────────────────
  wiremock-grpc:
    image: wiremock/wiremock:3.13.2
    depends_on:
      wiremock-grpc-extension:
        condition: service_completed_successfully
      wiremock-kafka-bridge-extension:
        condition: service_completed_successfully
      wiremock-grpc-descriptors:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      MOCKJDBC_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MOCKJDBC_KAFKA_TOPIC: mockjdbc.query.events
      MOCKJDBC_KAFKA_GROUP_ID: mockjdbc-wiremock-bridge
    command:
      - --port
      - "8080"
      - --root-dir
      - /home/wiremock
    ports:
      - "8088:8080"
    volumes:
#      - ./docker/wiremock/mappings:/home/wiremock/mappings:ro
      - wiremock_grpc_descriptors:/home/wiremock/grpc:ro
      - wiremock_extensions:/var/wiremock/extensions:ro

volumes:
  wiremock_extensions:
  wiremock_grpc_descriptors:
