spring:
  datasource:
    url: jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always

mockjdbc:
  proxy:
    datasource-id: users-proxy
    kafka:
      bootstrap-servers: ${MOCKJDBC_PROXY_KAFKA_BOOTSTRAP:localhost:9092}
      topic: ${MOCKJDBC_PROXY_KAFKA_TOPIC:mockjdbc.query.events}
      acks: ${MOCKJDBC_PROXY_KAFKA_ACKS:all}
      retries: ${MOCKJDBC_PROXY_KAFKA_RETRIES:3}

